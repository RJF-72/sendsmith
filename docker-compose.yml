# SendSmith — minimal production-shaped stack: app + Redis.
# Copy .env.example to .env first and set BASE_URL (the app service
# below overrides REDIS_HOST to "redis").
services:
  app:
    build: .
    ports:
      - "1443:1443"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FILE_DIR: /app/data
    volumes:
      - senddata:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  senddata:
  redisdata:
